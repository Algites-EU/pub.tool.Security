Artifact:
  TechnologyKinds: [java]
  Name: Algites credential CLI
  Description: Cross-platform command-line interface over the common Algites credential libraries.

Dependencies:
  - DependencyKind: algites
    Items:
      - GroupId: eu.algites.lib.security
        ArtifactId: pub.lib.Security_credentials.coreimpl
        Usage: product_implementation
        VersionRequirement:
          Exact: "1.0-SNAPSHOT"
      - GroupId: eu.algites.lib.security
        ArtifactId: pub.lib.Security_credentials.winstore
        Usage: product_runtime_only
        VersionRequirement:
          Exact: "1.0-SNAPSHOT"
      - GroupId: eu.algites.lib.security
        ArtifactId: pub.lib.Security_credentials.macstore
        Usage: product_runtime_only
        VersionRequirement:
          Exact: "1.0-SNAPSHOT"
      - GroupId: eu.algites.lib.security
        ArtifactId: pub.lib.Security_credentials.secretservicestore
        Usage: product_runtime_only
        VersionRequirement:
          Exact: "1.0-SNAPSHOT"
